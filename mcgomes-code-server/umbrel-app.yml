manifestVersion: 1
id: mcgomes-code-server
storage:
  dataRoot: data
category: developer
name: code-server (Marcello)
version: "4.141.0"
tagline: Run VS Code on your Umbrel
description: >-
  Run VS Code on your Umbrel and access it in the browser so you can
  code on any device with a consistent development environment. This way you can
  use your Umbrel not only to code from any device, anywhere, but to also speed
  up tests, compilations, downloads, and more.


  By running all intensive tasks run on your Umbrel, preserve battery life of your devices when you're on the go.
releaseNotes: >-
  Cópia fixada da versão 4.141.0 publicada pela Umbrel, com porta própria (8097)
  para conviver com o app oficial do catálogo, que ocupa a 8091.
developer: Coder
website: https://coder.com
dependencies: []
repo: https://github.com/cdr/code-server
support: https://github.com/cdr/code-server/discussions
port: 8097
icon: https://raw.githubusercontent.com/coder/code-server/main/src/browser/media/pwa-icon-512.png
gallery:
  - https://raw.githubusercontent.com/coder/code-server/main/src/browser/media/pwa-icon-512.png
  - https://raw.githubusercontent.com/coder/code-server/main/docs/assets/screenshot-1.png
  - https://raw.githubusercontent.com/coder/code-server/main/docs/assets/screenshot-2.png
path: ""
defaultUsername: ""
deterministicPassword: true
torOnly: false
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/commit/14f8b3aec8cb99ef0940ba0cd9df25b7126a95cc

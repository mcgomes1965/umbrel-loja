version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mcgomes-slskd_server_1
      APP_PORT: 5030
      PROXY_AUTH_WHITELIST: "/api/*"

  # O umbrelOS cria a pasta de dados como root:root, mas o slskd roda como
  # 1000:1000. Este servico roda uma vez, como root, ajustando o dono da pasta
  # antes do slskd subir (senao o app fica em loop com
  # "/app is not readable and/or writable by the current user").
  init:
    image: alpine:3.20
    user: "0:0"
    command: sh -c "mkdir -p /app && chown -R 1000:1000 /app"
    volumes:
      - ${APP_DATA_DIR}/data/slskd:/app
    restart: "no"

  server:
    image: slskd/slskd:0.26.0
    user: "1000:1000"
    init: true
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # permite configurar o Soulseek pela interface web (Options)
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_APP_DIR=/app
      # onde os arquivos baixados caem (mesma pasta que Lidarr/Jellyfin veem)
      - SLSKD_DOWNLOADS_DIR=/downloads/soulseek
      # particoes incompletas ficam separadas, para nao sujar a biblioteca
      - SLSKD_INCOMPLETE_DIR=/downloads/soulseek/incomplete
      # o Soulseek exige compartilhar para poder baixar
      - SLSKD_SHARED_DIR=/downloads/soulseek
      - SLSKD_UMASK=002
    ports:
      # porta de conexoes de entrada do Soulseek (pares)
      - "50300:50300/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/slskd:/app
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
